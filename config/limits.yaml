# 暴走・コスト増を防ぐ上限。どれかに達したら、新しい作業を始めません。
max_runs_per_day: 1          # 【最初の1週間は1本】1日に作れる「実行(記事1本分)」の数。慣れたら増やす
max_agent_steps_per_day: 30  # 1日に完了できるAgent作業の数(1つ=Agent1回分。コストの代わりの物差し)
max_ready_queue: 3           # 公開準備済みで「まだ投稿していない」記事がこの数になったら止まる
experiment_ratio: 0.3        # 企画のうち未検証の新テーマ(実験枠)に回す目安

# 承認なしモード:true にすると、承認1〜3を自動で通して記事を作り続けます。
# 機械の検品(未確認の数字や空欄が残っていないか等)は変わらず効き、引っかかれば止まります。
# noteやSNSへの投稿は、この設定に関係なく常に手動です。false に戻せばまた手動承認になります。
auto_approve: true

timezone: "Asia/Tokyo"       # 「1日」の区切りに使う時刻帯
