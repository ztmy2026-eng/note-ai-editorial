- date: '2026-11-16'
  theme: saving-insurance
  ai: false
  title: セールだから、で買う前に見る3つ
  alt_titles:
  - 「安いから」で買う前の3つ
  - セールの前に、先に決めておくこと
  aim: ブラックフライデー前に、買う前の確認を一緒に整理(得は『買わない・選ぶ』で出る額を仮の例で)
  failures:
  - セール名だけで決める
  - ポイントの条件を見ない
  - もともと買う予定だったか確認しない
  figures:
  - 見出し画像
  - 'fig1: 確認の順番(タイムライン)'
  - 'fig2: チェックリスト'
  affiliate: ''
  notes:
  - セールの日程・還元条件は各公式サイトで確認できたものだけ。未発表なら書かない(Amazon・楽天は11/16時点で未発表の報道)
  - 仮の例の金額は『仮の例』と明記
  - 数字・制度・金額・日付は、書く前に公式サイトで確認し、出典URLと日付を付ける。確認できない数字は書かない
- date: '2026-11-17'
  theme: saving-insurance
  ai: false
  title: この冬の電気代、補助でいくら変わる?
  alt_titles:
  - 冬の電気代、補助はいつから?
  - 電気代の補助、うちはいくら下がる
  aim: 広い読者に関わる電気・ガス補助(2026年12月使用分から、との報道)。いつ・いくら・何をすればいいかを公式で確かめて書く(得の記事)
  failures:
  - 補助があるから使い方を気にしなくなる
  - 請求書の金額しか見ない
  - 補助の期間を知らない
  figures:
  - 見出し画像
  - 'fig1: 確認の順番(タイムライン)'
  - 'fig2: チェックリスト'
  affiliate: ''
  notes:
  - '報道: 2026-10-29発表、12〜2月使用分、標準世帯で3か月約7000円程度(DLRI 2026-11-02)。未確認。経産省の公式発表で確認してから書く'
  - 確認できなければ、金額は書かず『確認中』扱いにせず省く
  - 数字・制度・金額・日付は、書く前に公式サイトで確認し、出典URLと日付を付ける。確認できない数字は書かない
- date: '2026-11-18'
  theme: investing
  ai: false
  title: 「貯金だけで足りる?」を3分で確かめる
  alt_titles:
  - 貯金だけで、10年後どうなる?
  - お金のこれから、まず確かめる3つ
  aim: 投資の話を出さず、貯金だけの場合のざっくり試算(計算スクリプト)で、これから始める人にも分かる入口にする
  failures:
  - 比べずに不安だけ持つ
  - 生活費と分けない
  - 始めない理由を探すだけで止まる
  figures:
  - 見出し画像
  - 'fig1: 確認の順番(タイムライン)'
  - 'fig2: チェックリスト'
  affiliate: ''
  notes:
  - 試算は前提を図の下に明記。収益の約束はしない
  - 制度名は題に出さない
  - 数字・制度・金額・日付は、書く前に公式サイトで確認し、出典URLと日付を付ける。確認できない数字は書かない
  read_minutes: 3
