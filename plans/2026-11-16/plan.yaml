  title: 家でできる副業、始めやすい順に比べる
  alt_titles:
  - 在宅の副業、何をして月いくら?
  - スキマ時間の副業、種類を比べる
  aim: 副業の具体的な中身を種類ごとに比べる(何をするか・初期費用・時間)。書類は最後に一言。11/14の記事と重ならないよう『家でできる』に絞る
  failures:
